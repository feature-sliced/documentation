name: Build Preview Deployment

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: |
          npm install -g corepack@latest
          corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      # Social preview images are rendered at build time and cached by content hash.
      - name: Retrieve social preview cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro-og-canvas
          key: og-images-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            og-images-${{ github.ref_name }}-
            og-images-main-

      - name: Build static
        run: pnpm build
        env:
          BASE_URL: /

      # Uploads the build directory as a workflow artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: build
